    <path d="M16 38 V22 a6 6 0 0 1 6-6 h16"/>
    <path d="M82 16 h16 a6 6 0 0 1 6 6 v16"/>
    <path d="M104 82 v16 a6 6 0 0 1-6 6 H82"/>
    <path d="M38 104 H22 a6 6 0 0 1-6-6 V82"/>
  </g>
  <!-- Globe: the multinational collaborative -->
  <g fill="none" stroke="#0b2a4a" stroke-width="3.5">
    <circle cx="60" cy="60" r="27"/>
    <ellipse cx="60" cy="60" rx="12.5" ry="27"/>
    <path d="M33.5 49 Q60 58.5 86.5 49"/>
    <path d="M33.5 71 Q60 61.5 86.5 71"/>
    <line x1="33" y1="60" x2="87" y2="60"/>
